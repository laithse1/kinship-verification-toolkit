name = "forestnn-fs-quality"
algorithm = "forestnn"
description = "Higher-quality ForestNN hybrid run on KinFaceW-II father-son with fused VGGFace and VGG-F global branches."
tags = ["forestnn", "kinfacew", "quality"]

[parameters]
dataset = "KinFaceW-II"
relation = "fs"
global_backbone = "vggface+vggf-precomputed"
fusion_model = "engineered-logreg"
local_encoder = "residual"
alignment_mode = "adaptive"
image_size = 32
embedding_dim = 16
hidden_dim = 24
batch_size = 16
num_epochs = 1
learning_rate = 0.001
weight_decay = 0.0001
val_fraction = 0.2
calibration_objective = "balanced_accuracy"
far_targets = [0.001, 0.01, 0.1]
random_state = 42
limit_pairs = 120
