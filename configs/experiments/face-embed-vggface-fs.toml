name = "face-embed-vggface-fs"
algorithm = "face-embed"
description = "Face-embedding threshold baseline on KinFaceW-II father-son using precomputed VGGFace embeddings and official folds."
tags = ["face-embed", "kinfacew-ii", "fs", "modern-baseline"]

[parameters]
dataset = "KinFaceW-II"
relation = "fs"
backbone = "vggface-precomputed"
calibration_objective = "balanced_accuracy"
far_targets = [0.001, 0.01, 0.1]
image_batch_size = 32
