name = "paper-revision-kinfacew-all-relations"
description = "Paper-oriented KinFaceW-II benchmark across all four relations for classical, KinVer, and face-embedding baselines."
tags = ["paper-revision", "kinfacew-ii", "all-relations", "comparison"]

[[experiments]]
name = "classical-fd-kfold"
algorithm = "classical"

[experiments.parameters]
dataset = "KinFaceW-II"
relation = "fd"
method = "kfold"

[[experiments]]
name = "kinver-fd"
algorithm = "kinver"

[experiments.parameters]
dataset = "KinFaceW-II"
relation = "fd"
iterations = 4
knn = 6

[[experiments]]
name = "face-embed-vggface-fd"
algorithm = "face-embed"

[experiments.parameters]
dataset = "KinFaceW-II"
relation = "fd"
backbone = "vggface-precomputed"
calibration_objective = "balanced_accuracy"
far_targets = [0.001, 0.01, 0.1]
image_batch_size = 32

