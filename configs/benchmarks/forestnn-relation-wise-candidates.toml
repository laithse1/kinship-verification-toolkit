name = "forestnn-relation-wise-candidates"
description = "Compare candidate ForestNN settings per KinFaceW-II relation and emit automatic winners."
tags = ["forestnn", "kinfacew", "relation-wise", "selection"]

[[experiments]]
name = "forestnn-fd-vggfacevggf-adaptive-residual"
algorithm = "forestnn"

[experiments.parameters]
dataset = "KinFaceW-II"
relation = "fd"
global_backbone = "vggface+vggf-precomputed"
fusion_model = "engineered-logreg"
local_encoder = "residual"
alignment_mode = "adaptive"
image_size = 32
embedding_dim = 16
hidden_dim = 24
batch_size = 16
num_epochs = 1
learning_rate = 0.001
weight_decay = 0.0001
val_fraction = 0.2
calibration_objective = "balanced_accuracy"
far_targets = [0.001, 0.01, 0.1]
random_state = 42
limit_pairs = 120

