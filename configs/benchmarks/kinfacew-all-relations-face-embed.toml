name = "kinfacew-all-relations-face-embed"
description = "Official-fold KinFaceW-II evaluation across all four parent-child relations using the face-embedding threshold baseline."
tags = ["face-embed", "kinfacew-ii", "all-relations", "paper-revision"]

[[experiments]]
name = "face-embed-vggface-fd"
algorithm = "face-embed"

[experiments.parameters]
dataset = "KinFaceW-II"
relation = "fd"
backbone = "vggface-precomputed"
calibration_objective = "balanced_accuracy"
far_targets = [0.001, 0.01, 0.1]
image_batch_size = 32

